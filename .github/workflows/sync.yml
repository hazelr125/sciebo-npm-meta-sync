name: sciebo-sync
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually too

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # stay under the 6-hour hard cap
    steps:
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Sync meta.json.zst files
        run: |
          rclone sync "sciebo:Backstabber's Knife Collection/samples/npm" "gdrive:meta_npm_only" \
            --include "*meta.json.zst" \
            --transfers 8 --checkers 8 \
            --retries 10 --low-level-retries 20 \
            -P
